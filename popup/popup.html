<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感发生器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- 引导页 -->
    <div id="onboarding" class="panel hidden">
      <h2 class="gradient-text">🎯 你是谁？</h2>
      <div id="identityGrid" class="grid-4"></div>
      <h2 class="gradient-text" style="margin-top:16px">🌟 你对什么感兴趣？</h2>
      <div id="interestGrid" class="grid-3"></div>
      <button id="onboardingDone" class="btn-primary" style="margin-top:16px;display:none">开始探索 →</button>
    </div>

    <!-- 主面板 -->
    <div id="mainPanel" class="panel">
      <!-- 标题栏 -->
      <div class="header">
        <span class="gradient-text title">💡 灵感发生器</span>
        <div class="header-btns">
          <button class="icon-btn" id="settingsBtn" title="AI设置">⚙️</button>
          <button class="icon-btn" id="favBtn" title="收藏">⭐ <span id="favCount" class="badge-num">0</span></button>
        </div>
      </div>

      <!-- 场景标签 -->
      <div id="sceneTabs" class="scene-tabs"></div>

      <!-- 困难输入 -->
      <div id="difficultySection" class="difficulty-section">
        <div id="difficultyToggle" class="difficulty-toggle">
          <span>💭 有具体问题？</span>
          <span class="toggle-arrow">▾</span>
        </div>
        <textarea id="difficultyInput" class="difficulty-input hidden" maxlength="200" placeholder="描述你遇到的困难或问题（200字内），AI 会根据上下文生成灵感..."></textarea>
      </div>

      <!-- 灵感卡片 -->
      <div id="cardContainer" class="card-container">
        <div id="inspireCard" class="inspire-card">
          <div class="card-inner" id="cardInner">
            <div class="card-front">
              <div id="rarityBadge" class="rarity-badge"></div>
              <div id="cardText" class="card-text">点击「刷灵感」开始 ✨</div>
              <div id="dimensionTags" class="dimension-tags"></div>
              <div id="encouragement" class="encouragement"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 操作栏 -->
      <div class="action-bar">
        <button id="methodBtn" class="btn-secondary" title="创意方法">🧠 方法</button>
        <button id="generateBtn" class="btn-primary pulse-glow">✨ 刷灵感</button>
        <button id="favActionBtn" class="btn-secondary" title="收藏">⭐</button>
      </div>

      <div id="feedbackBar" class="feedback-bar hidden">
        <span>这个灵感怎么样？</span>
        <button id="feedbackGood" class="fb-btn">👍 不错</button>
        <button id="feedbackBad" class="fb-btn">👎 一般</button>
      </div>

      <div id="toastContainer" class="toast-container"></div>
    </div>

    <!-- 浮动面板 -->
    <!-- 收藏面板 -->
    <div id="favPanel" class="float-panel hidden">
      <div class="float-header"><span>⭐ 收藏</span><button class="close-btn">✕</button></div>
      <div id="favList" class="float-list"></div>
    </div>

    <!-- AI设置面板 -->
    <div id="settingsPanel" class="float-panel hidden">
      <div class="float-header"><span>⚙️ AI 设置</span><button class="close-btn">✕</button></div>
      <div class="setting-group">
        <label>API Key</label>
        <input type="password" id="aiKey" placeholder="sk-..." />
      </div>
      <div class="setting-group">
        <label>API URL</label>
        <input type="text" id="aiUrl" placeholder="https://dashscope-intl.aliyuncs.com/compatible-mode/v1" />
      </div>
      <div class="setting-group">
        <label>模型</label>
        <input type="text" id="aiModel" placeholder="qwen-plus" />
      </div>
      <button id="saveSettings" class="btn-primary" style="margin-top:8px">保存</button>
    </div>

    <!-- 方法面板 -->
    <div id="methodPanel" class="float-panel hidden">
      <div class="float-header"><span>🧠 创意方法</span><button class="close-btn">✕</button></div>
      <div id="methodList" class="float-list"></div>
    </div>

    <!-- 产品方案面板 -->
    <div id="productPanel" class="float-panel hidden">
      <div class="float-header"><span>🚀 产品方案</span><button class="close-btn">✕</button></div>
      <div id="productContent" class="product-content"></div>
    </div>

    <!-- 新建场景面板 -->
    <div id="newScenePanel" class="float-panel hidden">
      <div class="float-header"><span>📦 新建场景</span><button class="close-btn">✕</button></div>
      <div class="setting-group"><label>名称</label><input id="nsName" placeholder="场景名称" maxlength="10"/></div>
      <div class="setting-group"><label>Emoji</label><input id="nsEmoji" placeholder="📦" maxlength="2"/></div>
      <div class="setting-group"><label>维度1名称</label><input id="nsDim1" placeholder="如：风格" maxlength="6"/></div>
      <div class="setting-group"><label>维度1素材（逗号分隔）</label><input id="nsDim1Pool" placeholder="素材1,素材2,素材3"/></div>
      <div class="setting-group"><label>维度2名称</label><input id="nsDim2" placeholder="如：角色" maxlength="6"/></div>
      <div class="setting-group"><label>维度2素材（逗号分隔）</label><input id="nsDim2Pool" placeholder="素材1,素材2,素材3"/></div>
      <div class="setting-group"><label>可见性</label>
        <select id="nsVisibility"><option value="local">仅本机</option></select>
      </div>
      <button id="nsSave" class="btn-primary" style="margin-top:8px">保存场景</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
